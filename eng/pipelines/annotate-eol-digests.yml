trigger: none
pr: none

parameters:
- name: dataFile
  displayName: Relative path to EOL annotations data file (e.g. eol-3.1.json for file in root of the branch)
  type: string

variables:
- template: templates/variables/image-builder.yml
# Temporarily disabled due to https://github.com/dotnet/docker-tools/issues/2056.
- name: publishEolAnnotations
  value: false
- name: dryRunArg
  value: ""
- name: eolAnnotationsWaitArg
  value: $[ iif(eq(variables['waitForIngestionEnabled'], 'true'), '--wait-for-ingestion', '') ]

extends:
  template: /eng/docker-tools/templates/1es-official.yml@self
  parameters:
    stages:
    - stage: eolAnnotate
      displayName: Annotate EOL images
      dependsOn: []
      jobs:
      - job: AnnotateImages
        displayName: Annotate EOL Images
        steps:
        - template: /eng/docker-tools/templates/steps/init-common.yml@self
          parameters:
            dockerClientOS: linux
        - template: /eng/docker-tools/templates/steps/reference-service-connections.yml@self
          parameters:
            serviceConnections:
            - name: $(publish.serviceConnectionName)
            - name: $(marStatus.serviceConnectionName)
        - template: /eng/docker-tools/templates/steps/run-imagebuilder.yml@self
          parameters:
            displayName: Attach Lifecycle Metadata
            serviceConnections:
            - name: mar
              id: $(marStatus.serviceConnection.id)
              tenantId: $(marStatus.serviceConnection.tenantId)
              clientId: $(marStatus.serviceConnection.clientId)
            internalProjectName: internal
            condition: and(succeeded(), eq(variables['publishEolAnnotations'], 'true'))
            args: >-
              attachLifecycleMetadata file
              '/repo/${{ parameters.dataFile }}'
              $(eolAnnotationsWaitArg)
              $(dryRunArg)
