  # Each image variant: the suffix in tags and Dockerfile paths, and the template that builds it.
  variants:
    extra: &variant-extra
      variant: -extra
      templateFile: Dockerfile.linux.extra
    composite: &variant-composite
      variant: -composite
      templateFile: Dockerfile.linux-composite
    composite-extra: &variant-composite-extra
      variant: -composite-extra
      templateFile: Dockerfile.linux-composite.extra
    chiseled: &variant-chiseled
      variant: -chiseled
    chiseled-extra: &variant-chiseled-extra
      variant: -chiseled-extra
      templateFile: Dockerfile.linux.extra
    chiseled-composite: &variant-chiseled-composite
      variant: -chiseled-composite
      templateFile: Dockerfile.linux-composite
    chiseled-composite-extra: &variant-chiseled-composite-extra
      variant: -chiseled-composite-extra
      templateFile: Dockerfile.linux-composite.extra
    distroless: &variant-distroless
      variant: -distroless
    distroless-extra: &variant-distroless-extra
      variant: -distroless-extra
      templateFile: Dockerfile.linux.extra
    distroless-composite: &variant-distroless-composite
      variant: -distroless-composite
      templateFile: Dockerfile.linux-composite
    distroless-composite-extra: &variant-distroless-composite-extra
      variant: -distroless-composite-extra
      templateFile: Dockerfile.linux-composite.extra
    aot: &variant-aot
      variant: -aot
      templateFile: Dockerfile.linux.aot

    # These repos build the same variant with a different template.
    runtime-deps:
      chiseled: &variant-runtime-deps-chiseled
        variant: -chiseled
        templateFile: Dockerfile.chiseled-ubuntu
      chiseled-extra: &variant-runtime-deps-chiseled-extra
        variant: -chiseled-extra
        templateFile: Dockerfile.chiseled-ubuntu.extra
      distroless: &variant-runtime-deps-distroless
        variant: -distroless
        templateFile: Dockerfile.distroless-azurelinux
      distroless-extra: &variant-runtime-deps-distroless-extra
        variant: -distroless-extra
        templateFile: Dockerfile.distroless-azurelinux.extra

  # Each OS, its target platforms, and the platforms for every arch it supports.
  # Images that use only some arches list their target platforms one by one.
  platforms:
    bookworm-slim:
      os: &bookworm-slim-os
        os: linux
        name: bookworm-slim
        displayName: "Debian 12"
        version: "12"
      amd64: &bookworm-slim-amd64
