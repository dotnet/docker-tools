      minorVersion: "10.0"
      patchVersion: "10.0.14"
      buildVersion: "10.0.14"
    aspnet: &aspnet-10.0
      minorVersion: "10.0"
      patchVersion: "10.0.14"
      buildVersion: "10.0.14"
    sdk: &sdk-10.0
      minorVersion: "10.0"
      patchVersion: "10.0.403"
      buildVersion: "10.0.403"

  # .NET 11.0: each product's version. Update them together.
  dotnet-11.0:
    runtime: &runtime-11.0
      minorVersion: "11.0"
      patchVersion: "11.0.0-rc.3"
      buildVersion: "11.0.0-rc.3.26522.148"
    aspnet: &aspnet-11.0
