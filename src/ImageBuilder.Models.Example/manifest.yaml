        displayName: "Azure Linux 4.0"
        version: "4.0"
      all: &azurelinux4.0
        amd64:
          os: *azurelinux4.0-os
          arch: amd64
          metadata: { downloadKey: linux-amd64 }
        arm64v8:
          os: *azurelinux4.0-os
          arch: arm64v8
          metadata: { downloadKey: linux-arm64v8 }

