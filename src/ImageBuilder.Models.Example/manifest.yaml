        arm64v8: &azurelinux3.0-arm64v8-platform
          targetPlatform: *azurelinux3.0-arm64v8
          metadata: *packageTarget-linux-arm64v8

    azurelinux4.0:
      os: &azurelinux4.0-os
        os: linux
        name: azurelinux4.0
        displayName: "Azure Linux 4.0"
        version: "4.0"
      amd64: &azurelinux4.0-amd64
        <<: *azurelinux4.0-os
        arch: amd64
