# Source matrix: https://github.com/dotnet/dotnet-docker/blob/c274006e716f5229b81a03b406b5c2e1cc9f0ffe/manifest.json
metadata:
  variant: ""

defaults:
  image:
    tags: &defaultSharedTags
      "{version.patchVersion}-{os}{variant}": {}
      "{version.minorVersion}-{os}{variant}": {}
  platform:
    dockerfile: "src/{repoKey}/{version.minorVersion}/{os}{variant}/{arch}/Dockerfile"
    tags: &defaultPlatformTags
      "{version.patchVersion}-{os}{variant}-{arch}": {}
      "{version.minorVersion}-{os}{variant}-{arch}": {}

definitions:
  convenienceTags: &convenienceTags
    "{version.patchVersion}": {}
    "{version.minorVersion}": {}

  aotConvenienceTags: &aotConvenienceTags
    "{version.patchVersion}-aot": {}
    "{version.minorVersion}-aot": {}

  alpineFloatingSharedTags: &alpineFloatingSharedTags
    "{version.minorVersion}-alpine{variant}": {}

  alpineFloatingPlatformTags: &alpineFloatingPlatformTags
    "{version.minorVersion}-alpine{variant}-{arch}": {}

  defaultWindowsSharedTags: &defaultWindowsSharedTags {}

  nanoserver1809:
    os: &nanoserver1809
      os: windows
      version: "1809"
      tagPart: nanoserver-1809
    platforms: &nanoserver1809Platforms
      amd64: &nanoserver1809Amd64
        targetPlatform:
          <<: *nanoserver1809
          arch: amd64
        tags: *defaultSharedTags

  nanoserver2022:
    os: &nanoserver2022
      os: windows
      version: ltsc2022
      tagPart: nanoserver-ltsc2022
    platforms: &nanoserver2022Platforms
      amd64: &nanoserver2022Amd64
        targetPlatform:
          <<: *nanoserver2022
          arch: amd64
        tags: *defaultSharedTags

  nanoserver2025:
    os: &nanoserver2025
      os: windows
      version: ltsc2025
      tagPart: nanoserver-ltsc2025
    platforms: &nanoserver2025Platforms
      amd64: &nanoserver2025Amd64
        targetPlatform:
          <<: *nanoserver2025
          arch: amd64
        tags: *defaultSharedTags

  servercore2019:
    os: &servercore2019
