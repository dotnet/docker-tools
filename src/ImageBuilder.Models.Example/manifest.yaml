  # Each image variant: the suffix in tags and Dockerfile paths, and the template that builds it.
  variants:
    extra: &variant-extra
      variant: -extra
      templateFile: Dockerfile.linux.extra
    composite: &variant-composite
      variant: -composite
      templateFile: Dockerfile.linux-composite
    composite-extra: &variant-composite-extra
      variant: -composite-extra
      templateFile: Dockerfile.linux-composite.extra
    chiseled: &variant-chiseled
      variant: -chiseled
    chiseled-extra: &variant-chiseled-extra
      variant: -chiseled-extra
      templateFile: Dockerfile.linux.extra
    chiseled-composite: &variant-chiseled-composite
      variant: -chiseled-composite
      templateFile: Dockerfile.linux-composite
    chiseled-composite-extra: &variant-chiseled-composite-extra
      variant: -chiseled-composite-extra
      templateFile: Dockerfile.linux-composite.extra
    distroless: &variant-distroless
      variant: -distroless
    distroless-extra: &variant-distroless-extra
      variant: -distroless-extra
      templateFile: Dockerfile.linux.extra
    distroless-composite: &variant-distroless-composite
      variant: -distroless-composite
      templateFile: Dockerfile.linux-composite
    distroless-composite-extra: &variant-distroless-composite-extra
      variant: -distroless-composite-extra
      templateFile: Dockerfile.linux-composite.extra
    aot: &variant-aot
      variant: -aot
      templateFile: Dockerfile.linux.aot

    # These repos build the same variant with a different template.
    runtime-deps:
      chiseled: &variant-runtime-deps-chiseled
        variant: -chiseled
        templateFile: Dockerfile.chiseled-ubuntu
      chiseled-extra: &variant-runtime-deps-chiseled-extra
        variant: -chiseled-extra
        templateFile: Dockerfile.chiseled-ubuntu.extra
      distroless: &variant-runtime-deps-distroless
        variant: -distroless
        templateFile: Dockerfile.distroless-azurelinux
      distroless-extra: &variant-runtime-deps-distroless-extra
        variant: -distroless-extra
        templateFile: Dockerfile.distroless-azurelinux.extra

  # The key Dockerfile templates use to pick each platform's downloads: os, libc, and arch.
  packageTargets:
    linux-amd64: &packageTarget-linux-amd64
      packageTarget: linux-amd64
    linux-arm32v7: &packageTarget-linux-arm32v7
      packageTarget: linux-arm32v7
    linux-arm64v8: &packageTarget-linux-arm64v8
      packageTarget: linux-arm64v8
    linux-musl-amd64: &packageTarget-linux-musl-amd64
      packageTarget: linux-musl-amd64
    linux-musl-arm32v7: &packageTarget-linux-musl-arm32v7
      packageTarget: linux-musl-arm32v7
    linux-musl-arm64v8: &packageTarget-linux-musl-arm64v8
      packageTarget: linux-musl-arm64v8
    windows-amd64: &packageTarget-windows-amd64
      packageTarget: windows-amd64

  # Each OS, its target platforms, and the platforms for every arch it supports.
  # Each platform carries the packageTarget its Dockerfile template uses to pick downloads.
  platforms:
    noble:
      os: &noble-os
        os: linux
        name: noble
        displayName: "Ubuntu 24.04"
        version: "24.04"
      amd64: &noble-amd64
        <<: *noble-os
        arch: amd64
      arm32v7: &noble-arm32v7
        <<: *noble-os
        arch: arm32v7
      arm64v8: &noble-arm64v8
        <<: *noble-os
        arch: arm64v8
      all: &noble
        amd64: &noble-amd64-platform
          targetPlatform: *noble-amd64
          metadata: *packageTarget-linux-amd64
        arm32v7: &noble-arm32v7-platform
          targetPlatform: *noble-arm32v7
          metadata: *packageTarget-linux-arm32v7
        arm64v8: &noble-arm64v8-platform
          targetPlatform: *noble-arm64v8
          metadata: *packageTarget-linux-arm64v8
      no-arm32: &noble-no-arm32
        amd64: *noble-amd64-platform
        arm64v8: *noble-arm64v8-platform

    resolute:
      os: &resolute-os
        os: linux
        name: resolute
        displayName: "Ubuntu 26.04"
        version: "26.04"
      amd64: &resolute-amd64
        <<: *resolute-os
        arch: amd64
      arm32v7: &resolute-arm32v7
        <<: *resolute-os
        arch: arm32v7
      arm64v8: &resolute-arm64v8
        <<: *resolute-os
        arch: arm64v8
      all: &resolute
