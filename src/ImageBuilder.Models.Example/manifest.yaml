        arch: amd64
      arm32v7: &bookworm-slim-arm32v7
        <<: *bookworm-slim-os
        arch: arm32v7
      arm64v8: &bookworm-slim-arm64v8
        <<: *bookworm-slim-os
        arch: arm64v8
      all: &bookworm-slim
        amd64:
          targetPlatform: *bookworm-slim-amd64
        arm32v7:
          targetPlatform: *bookworm-slim-arm32v7
        arm64v8:
          targetPlatform: *bookworm-slim-arm64v8

