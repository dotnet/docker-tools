          <<: *servercore2025
          arch: amd64
        tags: *defaultSharedTags

  bookworm-slim:
    os: &bookwormSlim
      os: linux
      version: "12"
      tagPart: bookworm-slim
    platforms: &bookwormSlimPlatforms
      amd64: &bookwormSlimAmd64
        targetPlatform:
          <<: *bookwormSlim
          arch: amd64
      arm32v7: &bookwormSlimArm32
        targetPlatform:
          <<: *bookwormSlim
          arch: arm32v7
      arm64v8: &bookwormSlimArm64
        targetPlatform:
          <<: *bookwormSlim
          arch: arm64v8

  noble:
    os: &noble
      os: linux
      version: "24.04"
