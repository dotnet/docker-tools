          targetPlatform: *resolute-amd64
          metadata: *packageTarget-linux-amd64
        arm32v7: &resolute-arm32v7-platform
          targetPlatform: *resolute-arm32v7
          metadata: *packageTarget-linux-arm32v7
        arm64v8: &resolute-arm64v8-platform
          targetPlatform: *resolute-arm64v8
          metadata: *packageTarget-linux-arm64v8
      no-arm32: &resolute-no-arm32
        amd64: *resolute-amd64-platform
        arm64v8: *resolute-arm64v8-platform

