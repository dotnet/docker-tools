      all: &azurelinux4.0
        amd64: &azurelinux4.0-amd64-platform
          targetPlatform: *azurelinux4.0-amd64
          metadata: *packageTarget-linux-amd64
        arm64v8: &azurelinux4.0-arm64v8-platform
          targetPlatform: *azurelinux4.0-arm64v8
          metadata: *packageTarget-linux-arm64v8

    # Windows images have one arch each.
    nanoserver-ltsc2022:
      os: &nanoserver-ltsc2022-os
        os: windows
        name: nanoserver-ltsc2022
        displayName: "Nano Server 2022"
