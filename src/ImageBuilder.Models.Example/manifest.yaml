      version: ltsc2019
      tagPart: windowsservercore-ltsc2019
    platforms: &servercore2019Platforms
      amd64: &servercore2019Amd64
        targetPlatform:
          <<: *servercore2019
          arch: amd64
        tags: *defaultSharedTags

  servercore2022:
