      minorVersion: "9.0"
      patchVersion: "9.0.22"
      buildVersion: "9.0.22"
    aspnet: &aspnet-9.0
      minorVersion: "9.0"
      patchVersion: "9.0.22"
      buildVersion: "9.0.22"
    sdk: &sdk-9.0
      minorVersion: "9.0"
      patchVersion: "9.0.320"
      buildVersion: "9.0.320"

  # .NET 10.0: each product's version. Update them together.
  dotnet-10.0:
