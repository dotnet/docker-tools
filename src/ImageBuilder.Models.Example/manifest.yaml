readme:
  path: README.md
  templatePath: eng/readme-templates/README.github.md

repos:
  runtime-deps:
    name: dotnet/runtime-deps
    readmes:
      - path: README.runtime-deps.md
        templatePath: eng/readme-templates/README.github.md
      - path: .portal-docs/docker-hub/README.runtime-deps.md
        templatePath: eng/readme-templates/README.dockerhub.md
      - path: .portal-docs/mar/README.runtime-deps.portal.md
        templatePath: eng/readme-templates/README.mcr.md
    mcrTagsMetadataTemplate: eng/mcr-tags-metadata-templates/runtime-deps-tags.yml
    # runtime-deps's base template is named Dockerfile, not Dockerfile.linux.
    metadata:
      templateFile: Dockerfile
    groups:
      "8.0":
        metadata:
          version: *runtime-8.0
        images:
          bookworm-slim:
            tags:
              <<: [*sharedTags, *convenienceTags]
            platforms: *bookworm-slim

          # .NET 8 has no floating -alpine-aot tag, only the per-arch ones.
          alpine3.24:
            tags:
              <<: [*sharedTags, *alpineFloatingTags, *aotAliasTags]
            defaults:
              platform:
                tags:
                  <<: [*defaultPlatformTags, *alpineFloatingPlatformTags, *aotAliasPlatformTags, *alpineFloatingAotAliasPlatformTags]
            platforms: *alpine3.24

          alpine3.24-extra:
            metadata: *variant-extra
            tags: *sharedTags
            defaults:
              platform:
                tags:
                  <<: [*defaultPlatformTags, *alpineFloatingPlatformTags]
            platforms: *alpine3.24

          # .NET 8 doesn't support arm32 on Noble.
          noble:
            tags: *sharedTags
            platforms:
              amd64:
                targetPlatform: *noble-amd64
