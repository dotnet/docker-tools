# Sample repo for trying out ManifestV2 and Dockerfile templates.
# .NET 10 runtime-deps, runtime, aspnet and sdk images on Ubuntu 24.04 (noble).
# Values and the Dockerfiles under src/ come from
# https://github.com/dotnet/dotnet-docker/tree/c274006e716f5229b81a03b406b5c2e1cc9f0ffe
registry: mcr.microsoft.com
metadata:
  # Each .NET release: every product's version and downloads. Update a release together.
  # Templates know their own product, so they read dotnet[version.minor].<product>.downloads[downloadKey].
  dotnet:
    "10.0":
      runtime: &dotnet-runtime-10.0
        minor: "10.0"
        patch: "10.0.14"
        build: "10.0.14"
        downloads:
          linux-x64:
            url: "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-x64.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-x64.tar.gz.sha512"
          linux-arm32:
            url: "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-arm.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-arm.tar.gz.sha512"
          linux-arm64:
            url: "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-arm64.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.14/dotnet-runtime-10.0.14-linux-arm64.tar.gz.sha512"
      aspnet: &dotnet-aspnet-10.0
        minor: "10.0"
        patch: "10.0.14"
        build: "10.0.14"
        downloads:
          linux-x64:
            url: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-x64.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-x64.tar.gz.sha512"
          linux-arm32:
            url: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-arm.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-arm.tar.gz.sha512"
          linux-arm64:
            url: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-arm64.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-arm64.tar.gz.sha512"
      sdk: &dotnet-sdk-10.0
        minor: "10.0"
        patch: "10.0.403"
        build: "10.0.403"
        downloads:
          linux-x64:
            url: "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-x64.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-x64.tar.gz.sha512"
          linux-arm32:
            url: "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-arm.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-arm.tar.gz.sha512"
          linux-arm64:
            url: "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-arm64.tar.gz"
            checksumUrl: "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-arm64.tar.gz.sha512"
      # The PowerShell the SDK ships, keyed by the downloadKey of each platform.
      powershell:
        version: "7.6.9"
        downloads:
          linux-x64:
            url: "https://powershellinfraartifacts-gkhedzdeaghdezhr.z01.azurefd.net/tool/7.6.9/PowerShell.Linux.x64.7.6.9.nupkg"
            digest: "sha256:e14ad06e1192ccb221a6bfbc804476dabae792bb5c9c7ad62793e5ff058d826e"
          linux-arm32:
            url: "https://powershellinfraartifacts-gkhedzdeaghdezhr.z01.azurefd.net/tool/7.6.9/PowerShell.Linux.arm32.7.6.9.nupkg"
            digest: "sha256:157b5dc526e2a4664831f308ab3cffd87dcf34123dec03dd6f3e1b7dcd76e0c8"
          linux-arm64:
            url: "https://powershellinfraartifacts-gkhedzdeaghdezhr.z01.azurefd.net/tool/7.6.9/PowerShell.Linux.arm64.7.6.9.nupkg"
            digest: "sha256:9d098cb700f518702a87bbc037dadb6a9d6b34489012431756fb2531503f436b"

defaults:
  platform:
    dockerfile: "src/{repoKey}/{version.minor}/{os.name}/{arch}/Dockerfile"
    dockerfileTemplate: "Dockerfile.{repoKey}.template"
    tags:
      "{version.patch}-{os.name}-{arch}": {}
      "{version.minor}-{os.name}-{arch}": {}

definitions:
  tags:
    sharedTags: &sharedTags
      "{version.patch}-{os.name}": {}
      "{version.minor}-{os.name}": {}
    convenienceTags: &convenienceTags
      "{version.patch}": {}
      "{version.minor}": {}

  # Ubuntu 24.04 and its platform for every arch it supports.
  # Each platform carries the downloadKey its Dockerfile template uses to pick downloads.
  noble-os: &noble-os
    family: linux
    name: noble
    displayName: "Ubuntu 24.04"
    version: "24.04"
  noble: &noble
    amd64:
      os: *noble-os
      arch: amd64
      metadata:
        downloadKey: linux-x64
    arm32v7:
      os: *noble-os
      arch: arm32v7
      metadata:
        downloadKey: linux-arm32
    arm64v8:
      os: *noble-os
      arch: arm64v8
      metadata:
        downloadKey: linux-arm64

repos:
  runtime-deps:
    name: dotnet/runtime-deps
    # runtime-deps images take the runtime's version.
    groups:
      "10.0":
        metadata:
          version: *dotnet-runtime-10.0
        images:
          noble:
            tags:
              <<: [*sharedTags, *convenienceTags]
              "latest": {}
            platforms: *noble

  runtime:
    name: dotnet/runtime
    # TODO: Pipelines need REPO to point at their own registry. ManifestV2 has no repo references yet.
    defaults:
      platform:
        buildArgs:
          REPO: mcr.microsoft.com/dotnet/runtime-deps
    groups:
      "10.0":
        metadata:
          version: *dotnet-runtime-10.0
        images:
          noble:
            tags:
              <<: [*sharedTags, *convenienceTags]
              "latest": {}
            platforms: *noble

  aspnet:
    name: dotnet/aspnet
    defaults:
      platform:
        buildArgs:
          REPO: mcr.microsoft.com/dotnet/runtime
    groups:
      "10.0":
        metadata:
          version: *dotnet-aspnet-10.0
        images:
          noble:
            tags:
              <<: [*sharedTags, *convenienceTags]
              "latest": {}
            platforms: *noble

  sdk:
    name: dotnet/sdk
    defaults:
      platform:
        buildArgs:
          REPO: mcr.microsoft.com/dotnet/aspnet
    groups:
      "10.0":
        metadata:
          version: *dotnet-sdk-10.0
        images:
          noble:
            tags:
              <<: [*sharedTags, *convenienceTags]
              "latest": {}
            platforms: *noble
