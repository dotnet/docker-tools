trigger: none
pr: none

parameters:
- name: dataFile
  displayName: Relative path to EOL annotations data file (e.g. eol-3.1.json for file in root of the branch)
  type: string

variables:
- template: /eng/pipelines/templates/variables/common.yml@self
- name: dryRunArg
  value: ""
- name: eolAnnotationsWaitArg
  value: $[ iif(eq(variables['waitForIngestionEnabled'], 'true'), '--wait-for-ingestion', '') ]

extends:
  template: /eng/docker-tools/templates/1es-official.yml@self
  parameters:
    stages:
    - template: /eng/docker-tools/templates/stages/dotnet/publish-config-prod.yml@self
      parameters:
        stagesTemplate: /eng/pipelines/templates/stages/annotate-eol-digests.yml@self
        stagesTemplateParameters:
          dataFile: ${{ parameters.dataFile }}
