  dotnet-8.0:
    runtime: &runtime-8.0
      minorVersion: "8.0"
      patchVersion: "8.0.33"
      buildVersion: "8.0.33"
    aspnet: &aspnet-8.0
      minorVersion: "8.0"
      patchVersion: "8.0.33"
      buildVersion: "8.0.33"
    sdk: &sdk-8.0
      minorVersion: "8.0"
      patchVersion: "8.0.427"
      buildVersion: "8.0.427"

  # .NET 9.0: each product's version. Update them together.
  dotnet-9.0:
