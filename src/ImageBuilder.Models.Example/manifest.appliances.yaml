# .NET Monitor 10 and Aspire Dashboard.
# Anchors hold the facts that change together on a release, and each Azure Linux target platform.
# Placeholders like {version.patchVersion} and {arch} keep repeated values from drifting apart.
# Values come from https://github.com/dotnet/dotnet-docker/blob/c274006e716f5229b81a03b406b5c2e1cc9f0ffe/manifest.json
# and the Dockerfiles generated at that commit.
readme:
  path: README.md
  templatePath: eng/readme-templates/README.github.md

definitions:
  # .NET Monitor: monitor-base and monitor share one version.
  monitor-version: &monitor-version
    majorVersion: "10"
    minorVersion: "10.0"
    patchVersion: "10.0.5"

  # Aspire Dashboard: the version used in tags, and each platform's download. Update them together.
  aspire-version: &aspire-version
    majorVersion: "13"
    minorVersion: "13.6"
    patchVersion: "13.6.2"
  aspire-amd64: &aspire-amd64
    aspireUrl: https://ci.dot.net/public/aspire/13.6.2-preview.1.26519.11/aspire-dashboard-linux-x64.zip
    aspireSha512: 4021f8b00b4d456d3d9b8e9231ae7c5ba454665d5d0b2fb3f3870261accd48a37cbf840c8b354cb2c50e3ff41d2438c0e6ebb7ce43e1352c93c34aae19acdeb5
  aspire-arm64v8: &aspire-arm64v8
    aspireUrl: https://ci.dot.net/public/aspire/13.6.2-preview.1.26519.11/aspire-dashboard-linux-arm64.zip
    aspireSha512: 555c346bed107b81539325e2b47e4d17ca615bf4993ec53dac16c3a1c9e23fb4b98bbeab628b3d7655752cc0ccfe81313925c0e709d9b75d3691cd18dd3f7fce

  azurelinux3.0: &azurelinux3.0
    os: linux
    name: azurelinux
    displayName: "Azure Linux 3.0"
    version: "3.0"

  azurelinux3.0-amd64: &azurelinux3.0-amd64
    <<: *azurelinux3.0
    arch: amd64
  azurelinux3.0-arm64v8: &azurelinux3.0-arm64v8
    <<: *azurelinux3.0
    arch: arm64v8

defaults:
  image:
    tags:
      "{version.patchVersion}": {}
      "{version.minorVersion}": {}
      "{version.majorVersion}": {}
      "latest": {}
  platform:
    dockerfile: "src/{repoKey}/{version.minorVersion}/{osName}{variant}/{arch}/Dockerfile"
    dockerfileTemplate: "eng/dockerfile-templates/{repoKey}/Dockerfile.linux"

repos:
  monitor-base:
    name: dotnet/monitor/base
    readmes:
      - path: README.monitor-base.md
        templatePath: eng/readme-templates/README.github.md
      - path: .portal-docs/docker-hub/README.monitor-base.md
        templatePath: eng/readme-templates/README.dockerhub.md
      - path: .portal-docs/mar/README.monitor-base.portal.md
        templatePath: eng/readme-templates/README.mcr.md
    mcrTagsMetadataTemplate: eng/mcr-tags-metadata-templates/monitor-base-tags.yml
    images:
      10.0-azurelinux-distroless:
        metadata:
          variant: -distroless
          version: *monitor-version
          baseTag: "10.0.14-azurelinux3.0-distroless-{arch}"
          monitorUrl: "https://builds.dotnet.microsoft.com/dotnet/diagnostics/monitor/{version.patchVersion}/dotnet-monitor-base-{version.patchVersion}-{rid}.tar.gz"
          monitorChecksumUrl: "{monitorUrl}.sha512"
        defaults:
          platform:
            buildArgs:
              REPO: mcr.microsoft.com/dotnet/aspnet
            tags:
              "{version.patchVersion}-{arch}": {}
              "{version.minorVersion}-{arch}": {}
        platforms:
          amd64:
            targetPlatform: *azurelinux3.0-amd64
            metadata:
              rid: linux-x64
          arm64v8:
            targetPlatform: *azurelinux3.0-arm64v8
            metadata:
              rid: linux-arm64

  monitor:
    name: dotnet/monitor
    readmes:
      - path: README.monitor.md
        templatePath: eng/readme-templates/README.github.md
      - path: .portal-docs/docker-hub/README.monitor.md
        templatePath: eng/readme-templates/README.dockerhub.md
      - path: .portal-docs/mar/README.monitor.portal.md
        templatePath: eng/readme-templates/README.mcr.md
    mcrTagsMetadataTemplate: eng/mcr-tags-metadata-templates/monitor-tags.yml
    images:
      10.0-azurelinux-distroless:
        metadata:
          variant: -distroless
          version: *monitor-version
          # The monitor-base platform tag this image builds on.
          baseTag: "{version.patchVersion}-{arch}"
          azureBlobStorageUrl: "https://builds.dotnet.microsoft.com/dotnet/diagnostics/monitor/{version.patchVersion}/dotnet-monitor-egress-azureblobstorage-{version.patchVersion}-{rid}.tar.gz"
          azureBlobStorageChecksumUrl: "{azureBlobStorageUrl}.sha512"
          s3StorageUrl: "https://builds.dotnet.microsoft.com/dotnet/diagnostics/monitor/{version.patchVersion}/dotnet-monitor-egress-s3storage-{version.patchVersion}-{rid}.tar.gz"
          s3StorageChecksumUrl: "{s3StorageUrl}.sha512"
        defaults:
          platform:
            buildArgs:
              REPO: mcr.microsoft.com/dotnet/monitor/base
            tags:
              "{version.patchVersion}-{arch}": { undocumented: true }
              "{version.minorVersion}-{arch}": { undocumented: true }
        platforms:
          amd64:
            targetPlatform: *azurelinux3.0-amd64
            metadata:
              rid: linux-x64
          arm64v8:
            targetPlatform: *azurelinux3.0-arm64v8
            metadata:
              rid: linux-arm64

  aspire-dashboard:
    name: aspire/dashboard
    readmes:
      - path: README.aspire-dashboard.md
        templatePath: eng/readme-templates/README.aspire-dashboard.github.md
      - path: .portal-docs/docker-hub/README.aspire-dashboard.md
        templatePath: eng/readme-templates/README.aspire-dashboard.dockerhub.md
      - path: .portal-docs/mar/README.dashboard.portal.md
        templatePath: eng/readme-templates/README.aspire-dashboard.mcr.md
    mcrTagsMetadataTemplate: eng/mcr-tags-metadata-templates/dashboard-tags.yml
    # Aspire Dashboard has one version and one OS, so its Dockerfiles sit directly under the repo.
    defaults:
      platform:
        dockerfile: "src/{repoKey}/{arch}/Dockerfile"
    images:
      azurelinux-distroless:
        syndication: dotnet/aspire-dashboard
        metadata:
          variant: -distroless
          version: *aspire-version
          baseTag: "11.0.0-rc.3-azurelinux3.0-distroless-extra-{arch}"
        defaults:
          platform:
            buildArgs:
              REPO: mcr.microsoft.com/dotnet/runtime-deps
            tags:
              "{version.patchVersion}-{arch}": { undocumented: true }
              "{version.minorVersion}-{arch}": { undocumented: true }
              "{version.majorVersion}-{arch}": { undocumented: true }
        platforms:
          amd64:
            targetPlatform: *azurelinux3.0-amd64
            metadata: *aspire-amd64
          arm64v8:
            targetPlatform: *azurelinux3.0-arm64v8
            metadata: *aspire-arm64v8
