          metadata: *packageTarget-linux-musl-amd64
        arm32v7: &alpine3.24-arm32v7-platform
          targetPlatform: *alpine3.24-arm32v7
          metadata: *packageTarget-linux-musl-arm32v7
        arm64v8: &alpine3.24-arm64v8-platform
          targetPlatform: *alpine3.24-arm64v8
          metadata: *packageTarget-linux-musl-arm64v8
      no-arm32: &alpine3.24-no-arm32
        amd64: *alpine3.24-amd64-platform
        arm64v8: *alpine3.24-arm64v8-platform

    azurelinux3.0:
      os: &azurelinux3.0-os
        os: linux
        name: azurelinux3.0
        displayName: "Azure Linux 3.0"
        version: "3.0"
      amd64: &azurelinux3.0-amd64
