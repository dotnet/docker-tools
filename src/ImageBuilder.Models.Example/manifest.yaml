# .NET runtime-deps, runtime, aspnet and sdk images, written with repo groups.
# Source matrix: https://github.com/dotnet/dotnet-docker/blob/c274006e716f5229b81a03b406b5c2e1cc9f0ffe/manifest.json
# Versions: https://github.com/dotnet/dotnet-docker/blob/c274006e716f5229b81a03b406b5c2e1cc9f0ffe/manifest.versions.json
# Anchors hold the facts that change together on a release, and each target platform.
# Placeholders like {version.minorVersion}, {osName}, {os} and {arch} keep repeated values from drifting apart.
metadata:
  variant: ""
  # Images with their own template, like extra and AOT, override this.
  templateFile: "Dockerfile.{os}"

defaults:
  platform:
    dockerfile: "src/{repoKey}/{version.minorVersion}/{osName}{variant}/{arch}/Dockerfile"
    dockerfileTemplate: "eng/dockerfile-templates/{repoKey}/{templateFile}"
    tags: &defaultPlatformTags
      "{version.patchVersion}-{osName}{variant}-{arch}": {}
      "{version.minorVersion}-{osName}{variant}-{arch}": {}

definitions:
  tags:
    sharedTags: &sharedTags
      "{version.patchVersion}-{osName}{variant}": {}
      "{version.minorVersion}-{osName}{variant}": {}
    convenienceTags: &convenienceTags
      "{version.patchVersion}{variant}": {}
      "{version.minorVersion}{variant}": {}
    alpineFloatingTags: &alpineFloatingTags
      "{version.minorVersion}-alpine{variant}": {}
    alpineFloatingPlatformTags: &alpineFloatingPlatformTags
      "{version.minorVersion}-alpine{variant}-{arch}": {}
    # Undocumented -aot aliases for runtime-deps Alpine images, which AOT apps also use.
    aotAliasTags: &aotAliasTags
      "{version.patchVersion}-{osName}-aot": { undocumented: true }
      "{version.minorVersion}-{osName}-aot": { undocumented: true }
    aotAliasPlatformTags: &aotAliasPlatformTags
      "{version.patchVersion}-{osName}-aot-{arch}": { undocumented: true }
      "{version.minorVersion}-{osName}-aot-{arch}": { undocumented: true }
    alpineFloatingAotAliasTags: &alpineFloatingAotAliasTags
      "{version.minorVersion}-alpine-aot": { undocumented: true }
    alpineFloatingAotAliasPlatformTags: &alpineFloatingAotAliasPlatformTags
      "{version.minorVersion}-alpine-aot-{arch}": { undocumented: true }

